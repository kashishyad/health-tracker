<section class="vitals-grid" aria-label="Regional Vital Indicators">
  <!-- Card 1: ICU Beds -->
  <label for="filter-critical" class="vital-card status-critical-theme vitals-drill-link" role="button" tabindex="0" title="Click to filter critical hospitals">
    <div class="vital-header">
      <span class="vital-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:4px;"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
        ICU Beds
      </span>
      <span class="vital-status-pill critical">
        <span class="live-pulse-dot critical" aria-hidden="true"></span>
        92.4% SURGE
      </span>
    </div>
    <div class="vital-value-wrap">
      <span class="vital-number">32</span>
      <span class="vital-unit">/ 360 Free Beds</span>
    </div>
    <div class="vital-bar-track" role="progressbar" aria-valuenow="91" aria-valuemin="0" aria-valuemax="100">
      <div class="vital-bar-fill critical" style="width: 91.1%;"></div>
    </div>
    <div class="vital-subtext">
      <span>Jaunpur: <strong>3 Free</strong></span>
      <span>Gorakhpur: <strong>4 Free</strong></span>
    </div>
  </label>

  <!-- Card 2: O2 Reserves -->
  <label for="filter-warning" class="vital-card status-warning-theme vitals-drill-link" role="button" tabindex="0" title="Click to filter warning hospitals">
    <div class="vital-header">
      <span class="vital-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:4px;"><path d="M6 3h12l2 6H4z"/><path d="M4 9v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><line x1="10" x2="14" y1="13" y2="13"/></svg>
        Oxygen (LMO)
      </span>
      <span class="vital-status-pill warning">
        <span class="live-pulse-dot warning" aria-hidden="true"></span>
        12.8 HRS
      </span>
    </div>
    <div class="vital-value-wrap">
      <span class="vital-number">28.4</span>
      <span class="vital-unit">kL Cryo Reserves</span>
    </div>
    <div class="vital-bar-track" role="progressbar" aria-valuenow="52" aria-valuemin="0" aria-valuemax="100">
      <div class="vital-bar-fill warning" style="width: 52%;"></div>
    </div>
    <div class="vital-subtext">
      <span>Jaunpur: <strong>5.2 kL</strong></span>
      <span>Trucks: <strong>3 En-Route</strong></span>
    </div>
  </label>

  <!-- Card 3: Doctors -->
  <label for="filter-stable" class="vital-card status-stable-theme vitals-drill-link" role="button" tabindex="0" title="Click to filter stable hospitals">
    <div class="vital-header">
      <span class="vital-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:4px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Specialists
      </span>
      <span class="vital-status-pill stable">
        <span class="live-pulse-dot stable" aria-hidden="true"></span>
        74 ACTIVE
      </span>
    </div>
    <div class="vital-value-wrap">
      <span class="vital-number">74</span>
      <span class="vital-unit">On Floor Duty</span>
    </div>
    <div class="vital-bar-track" role="progressbar" aria-valuenow="88" aria-valuemin="0" aria-valuemax="100">
      <div class="vital-bar-fill stable" style="width: 88%;"></div>
    </div>
    <div class="vital-subtext">
      <span>Surgeons: <strong>16</strong></span>
      <span>Anesthetists: <strong>12</strong></span>
    </div>
  </label>

  <!-- Card 4: 108 Fleet -->
  <label for="filter-all" class="vital-card status-cyan-theme vitals-drill-link" role="button" tabindex="0" title="Click to show all hospitals">
    <div class="vital-header">
      <span class="vital-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:4px;"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        108 Transit
      </span>
      <span class="vital-status-pill info">
        <span class="live-pulse-dot stable" aria-hidden="true"></span>
        46/52 ACTIVE
      </span>
    </div>
    <div class="vital-value-wrap">
      <span class="vital-number">13.5</span>
      <span class="vital-unit">min Avg ETA</span>
    </div>
    <div class="vital-bar-track" role="progressbar" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100">
      <div class="vital-bar-fill cyan" style="width: 85%;"></div>
    </div>
    <div class="vital-subtext">
      <span>Jaunpur: <strong>22 Active</strong></span>
      <span>Gorakhpur: <strong>24 Active</strong></span>
    </div>
  </label>
</section>
